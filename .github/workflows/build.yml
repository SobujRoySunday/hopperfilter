name: Build

# Builds the mod for every Minecraft line in versions/.
# Pushing a tag like v1.2.3 also publishes a GitHub Release with one jar per line.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Find Minecraft versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          matrix=$(ls versions/*.properties | xargs -n1 basename | sed 's/\.properties$//' | sort -V | jq -R . | jq -sc .)
          echo "Building for: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Minecraft ${{ matrix.mc }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hopperfilter-mc${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches mod_version
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${mod_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version} in gradle.properties"
            exit 1
          fi
          echo "MOD_VERSION=${mod_version}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hopperfilter-mc*
          merge-multiple: true

      - name: Pick release files
        run: |
          mkdir release
          find artifacts -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          ls -l release

      - name: Write release notes
        run: |
          {
            echo "Download the jar that matches your Minecraft version and drop it into your \`mods\` folder together with [Fabric API](https://modrinth.com/mod/fabric-api)."
            echo
            echo "| Minecraft | File |"
            echo "|---|---|"
            for f in $(ls release/*.jar | sort -V); do
              name=$(basename "$f")
              mc=$(echo "$name" | sed -E 's/.*-mc(.*)\.jar$/\1/')
              echo "| $mc | \`$name\` |"
            done
            echo
            # Changelog section for this version, if there is one.
            awk -v v="$MOD_VERSION" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && index($0, "## [") == 1 { exit }
              on && substr($0, 1, 1) == "[" && index($0, "]: ") > 0 { exit }
              on { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Hopper Filter Setup ${{ env.MOD_VERSION }}
          body_path: release-notes.md
          files: release/*.jar
          fail_on_unmatched_files: true
